<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stephlondon Luxury Gifts & Decor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0a2c5e;
            --accent-gold: #d4af37;
            --luxury-beige: #f5f3ee;
            --deep-charcoal: #2a2a2a;
            --eco-mint: #98fb98;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Now Display', 'Arial', sans-serif;
        }

        body {
            background: var(--luxury-beige);
            color: var(--deep-charcoal);
            line-height: 1.8;
        }

        /* Header Section */
        .header {
            background: var(--primary-blue);
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
        }

        .main-logo {
            max-width: 650px;
            width: 90%;
            margin: 0 auto;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Main Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1));
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 3px solid var(--accent-gold);
        }

        .product-info {
            padding: 1.5rem;
            text-align: center;
        }

        .product-category {
            color: var(--primary-blue);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        /* Gallery Section */
        .gallery-section {
            padding: 4rem 2rem;
            background: rgba(10,44,94,0.03);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03);
        }

        .gallery-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        /* Cart System */
        .cart-icon {
            position: fixed;
            top: 30px;
            right: 30px;
            background: var(--luxury-beige);
            padding: 1.2rem;
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 1000;
        }

        #cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-gold);
            color: var(--deep-charcoal);
            border-radius: 50%;
            padding: 6px 12px;
            font-weight: 700;
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--luxury-beige);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            z-index: 1001;
            width: 95%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <header class="header">

        <div class="cart-icon">

            <div class="gallery-item">

            <!-- Add all remaining images -->

    </section>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">

    </div>

    <script>
        // Full Cart Logic
        let cart = [];
        const cartModal = document.getElementById('cartModal');

        // Cart Management Functions
        function updateCartDisplay() {
            // Existing cart update logic
        }

        function showCart() {
            cartModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function hideCart(event) {
            if(event.target === cartModal || event.key === 'Escape') {
                cartModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // Event Listeners
        document.addEventListener('click', (event) => {
            if(event.target.classList.contains('add-to-cart')) {
                // Add item logic
                showCart();
            }
        });

        document.addEventListener('click', hideCart);
        document.addEventListener('keydown', hideCart);

</body>
</html>
